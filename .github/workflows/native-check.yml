name: Native Check

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Cargo test (Host)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markdown

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: markdown

      - name: Cargo test
        run: cargo test -- --test-threads=1

  check-android:
    name: Cargo check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch_name: arm64-v8a
            api: 21
          - target: armv7-linux-androideabi
            arch_name: armeabi-v7a
            api: 21
          - target: x86_64-linux-android
            arch_name: x86_64
            api: 21
          - target: i686-linux-android
            arch_name: x86
            api: 21
    defaults:
      run:
        working-directory: markdown

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK via sdkmanager
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Configure C compiler environment
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/26.3.11579264/toolchains/llvm/prebuilt/linux-x86_64/bin"
          
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              HOST_PREFIX="aarch64-linux-android${{ matrix.api }}"
              ;;
            armv7-linux-androideabi)
              HOST_PREFIX="armv7a-linux-androideabi${{ matrix.api }}"
              ;;
            x86_64-linux-android)
              HOST_PREFIX="x86_64-linux-android${{ matrix.api }}"
              ;;
            i686-linux-android)
              HOST_PREFIX="i686-linux-android${{ matrix.api }}"
              ;;
          esac

          echo "CC=${TOOLCHAIN}/${HOST_PREFIX}-clang" >> $GITHUB_ENV
          echo "AR=${TOOLCHAIN}/llvm-ar" >> $GITHUB_ENV
          echo "LD=${TOOLCHAIN}/ld.lld" >> $GITHUB_ENV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          workspaces: markdown

      - name: Cargo check
        run: cargo check --target ${{ matrix.target }}
