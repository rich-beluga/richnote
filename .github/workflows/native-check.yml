name: Native Check

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: cargo check + cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markdown

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: markdown

      - name: Cargo test
        run: cargo test

      - name: Cargo check - arm64-v8a (aarch64-linux-android)
        run: cargo check --target aarch64-linux-android

      - name: Cargo check - armeabi-v7a (armv7-linux-androideabi)
        run: cargo check --target armv7-linux-androideabi

      - name: Cargo check - x86_64
        run: cargo check --target x86_64-linux-android

      - name: Cargo check - x86 (i686-linux-android)
        run: cargo check --target i686-linux-android
