name: Build APKs

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-native:
    name: Build libmarkdown.so
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markdown

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK via sdkmanager
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: markdown

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cargo test
        run: cargo test -- --test-threads=1

      - name: Build .so for all ABIs
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            --platform 31 \
            -o jniLibs \
            build --release

      - name: Upload native artifact (intermediate)
        uses: actions/upload-artifact@v7
        with:
          name: native-jniLibs
          path: markdown/jniLibs
          if-no-files-found: error
          retention-days: 1

  build-debug:
    name: Debug APK
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download native artifact into jniLibs
        uses: actions/download-artifact@v8
        with:
          name: native-jniLibs
          path: app/src/main/jniLibs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Debug Keystore
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE }}" | base64 --decode > ~/.android/debug.keystore

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: richnote-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
    name: Release APK
    needs: build-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download native artifact into jniLibs
        uses: actions/download-artifact@v8
        with:
          name: native-jniLibs
          path: app/src/main/jniLibs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        id: sign_apk
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Upload release APK
        uses: actions/upload-artifact@v7
        with:
          name: richnote-release-apk
          path: ${{steps.sign_apk.outputs.signedFile}}
          if-no-files-found: error
          retention-days: 14

  all-builds-passed:
    name: All builds passed
    needs: [build-native, build-debug, build-release]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check job results
        run: |
          if [ "${{ needs.build-native.result }}" != "success" ] || \
             [ "${{ needs.build-debug.result }}" != "success" ] || \
             [ "${{ needs.build-release.result }}" != "success" ]; then
            echo "Хотя бы одна job упала — см. build-native/build-debug/build-release выше."
            exit 1
          fi
          echo "Все три job (native, debug, release) прошли успешно."
          