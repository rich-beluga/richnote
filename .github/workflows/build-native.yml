name: Build native (libmarkdown.so)

on:
  push:
    branches: [main]
    paths:
      - "markdown/**"
      - ".github/workflows/build-native.yml"
  pull_request:
    paths:
      - "markdown/**"
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build libmarkdown.so (arm64-v8a, armeabi-v7a, x86_64, x86)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: markdown

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: markdown

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          link-to-sdk: true
          local-cache: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run host tests
        run: cargo test

      - name: Build .so for all ABIs
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o jniLibs \
            build --release

      - name: List built artifacts
        run: find jniLibs -type f

      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: libmarkdown-jniLibs
          path: markdown/jniLibs
          if-no-files-found: error
          retention-days: 14
